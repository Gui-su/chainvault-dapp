<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>版权市场 · ChainVault</title>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
</head>
<body>
<header class="nav" data-nav></header>

<section class="container" style="padding:40px 24px 0">
  <div class="crumb"><a href="../index.html">首页</a> / 版权市场</div>
  <div class="row between wrap mb-24">
    <div>
      <h1 style="margin:0 0 6px;font-size:34px">版权交易市场</h1>
      <p class="dim" style="margin:0">全部作品均已完成链上存证，支持按品类、授权方式与热度筛选。</p>
    </div>
    <a class="btn btn-primary" href="create.html">🛡️ 我要确权上链</a>
  </div>

  <div class="grid g-4 mb-24" id="marketStats"></div>

  <!-- 筛选 -->
  <div class="card mb-24" style="padding:18px 20px">
    <div class="row wrap" style="gap:14px">
      <input class="input" id="q" placeholder="🔍 搜索作品标题、作者或标签…" style="max-width:340px">
      <select class="select" id="fType" style="max-width:170px">
        <option value="">全部品类</option>
        <option value="art">🎨 数字艺术品</option>
        <option value="music">🎵 音乐作品</option>
        <option value="literature">✍️ 文学作品</option>
      </select>
      <select class="select" id="fLic" style="max-width:190px">
        <option value="">全部授权方式</option>
        <option value="personal">个人欣赏授权</option>
        <option value="commercial">商用授权</option>
        <option value="derivative">改编权</option>
        <option value="exclusive">独家买断</option>
      </select>
      <select class="select" id="fSort" style="max-width:170px">
        <option value="new">最新上链</option>
        <option value="hot">最多浏览</option>
        <option value="like">最多收藏</option>
        <option value="pdesc">价格从高到低</option>
        <option value="pasc">价格从低到高</option>
      </select>
      <div class="spacer"></div>
      <button class="btn btn-ghost btn-sm" id="reset">重置筛选</button>
    </div>
  </div>

  <div class="row wrap mb-16" id="chips" style="gap:8px"></div>
  <div class="grid g-auto" id="list"></div>
  <div id="empty"></div>
</section>

<footer class="footer" data-footer></footer>

<script src="../assets/js/store.js"></script>
<script src="../assets/js/web3.js"></script>
<script src="../assets/js/app.js"></script>
<script>
App.mountNav('works');

const chipTypes = [
  {k:'', label:'全部'},
  {k:'art', label:'🎨 数字艺术品'},
  {k:'music', label:'🎵 音乐作品'},
  {k:'literature', label:'✍️ 文学作品'},
];
let chipCur = '';

const els = {
  q: document.getElementById('q'),
  type: document.getElementById('fType'),
  lic: document.getElementById('fLic'),
  sort: document.getElementById('fSort'),
  list: document.getElementById('list'),
  empty: document.getElementById('empty'),
};

function renderChips(){
  document.getElementById('chips').innerHTML = chipTypes.map(c=>
    `<button class="badge ${chipCur===c.k?'info':''}" data-c="${c.k}" style="padding:7px 14px;font-size:13px;cursor:pointer">${c.label}</button>`
  ).join('');
  document.querySelectorAll('#chips button').forEach(b=>{
    b.onclick = ()=>{ chipCur = b.dataset.c; els.type.value = chipCur; renderChips(); render(); };
  });
}

function render(){
  const kw = els.q.value.trim().toLowerCase();
  const t = els.type.value, lc = els.lic.value, st = els.sort.value;
  let rows = Store.works().filter(w=>w.status==='approved');
  if (t) rows = rows.filter(w=>w.type===t);
  if (lc) rows = rows.filter(w=>w.licenseType===lc);
  if (kw) rows = rows.filter(w =>
    (w.title+' '+w.ownerName+' '+(w.tags||[]).join(' ')+' '+w.desc).toLowerCase().includes(kw));
  const sorters = {
    new:(a,b)=>new Date(b.createdAt)-new Date(a.createdAt),
    hot:(a,b)=>(b.views||0)-(a.views||0),
    like:(a,b)=>(b.likes||0)-(a.likes||0),
    pdesc:(a,b)=>b.price-a.price,
    pasc:(a,b)=>a.price-b.price,
  };
  rows.sort(sorters[st]);

  els.list.innerHTML = rows.map(App.workCard).join('');
  els.empty.innerHTML = rows.length ? '' : `
    <div class="empty card mt-16">
      <div class="ico">🔍</div>
      <p>没有符合条件的作品，试试更换筛选条件或关键词</p>
      <button class="btn btn-outline" onclick="document.getElementById('reset').click()">清除筛选</button>
    </div>`;
}

function stats(){
  const works = Store.works().filter(w=>w.status==='approved');
  const orders = Store.orders();
  const vol = orders.reduce((a,o)=>a+Number(o.amount||0),0);
  const lic = Store.licenses().length;
  const data = [
    {k:'在售版权资产', v: App.fmt.num(works.length), d:'本周新增 ' + works.filter(w=>Date.now()-new Date(w.createdAt)<7*864e5).length + ' 件'},
    {k:'累计成交笔数', v: App.fmt.num(orders.length + 1876), d:'成交率 68.4%'},
    {k:'市场成交额', v: App.fmt.num(Math.round(vol + 942)) + ' ETH', d:'均价 ' + App.fmt.eth(vol/Math.max(orders.length,1)) + ' ETH'},
    {k:'生效中授权', v: App.fmt.num(lic + 431), d:'本月到期 12 份'},
  ];
  document.getElementById('marketStats').innerHTML = data.map(s=>
    `<div class="stat"><div class="k">${s.k}</div><div class="v">${s.v}</div><div class="d up">${s.d}</div></div>`).join('');
}

let timer;
els.q.oninput = ()=>{ clearTimeout(timer); timer = setTimeout(render, 200); };
[els.type, els.lic, els.sort].forEach(e=>e.onchange = render);
document.getElementById('reset').onclick = ()=>{
  els.q.value=''; els.type.value=''; els.lic.value=''; els.sort.value='new'; chipCur='';
  renderChips(); render();
};

renderChips(); stats(); render();
</script>
</body>
</html>
